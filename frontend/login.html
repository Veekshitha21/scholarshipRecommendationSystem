<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - ScholarMatch</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="welcome-page">
  <header class="nav-header">
    <div class="nav-container">
      <a class="logo" href="welcome.html" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none;">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Graduation cap mortarboard -->
          <polygon points="4,12 16,6 28,12 16,18" fill="#000000" stroke="#000000" stroke-width="1"/>
          <!-- Cap front (front part of mortarboard) -->
          <polygon points="6,12 16,8 26,12" fill="#0a0a0a" stroke="#000000" stroke-width="0.5"/>
          <!-- Cap sides shadow -->
          <polygon points="4,12 10,16 16,18 10,14" fill="#1a1a1a" opacity="0.7"/>
          <polygon points="28,12 22,16 16,18 22,14" fill="#1a1a1a" opacity="0.7"/>
          <!-- Tassel string -->
          <line x1="16" y1="18" x2="16" y2="26" stroke="#000000" stroke-width="1.5"/>
          <!-- Tassel bulb -->
          <circle cx="16" cy="27" r="2" fill="#000000"/>
        </svg>
        <span class="logo-text" style="background: linear-gradient(135deg, #FF8A5B 0%, #00B4A6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ScholarMatch</span>
      </a>
    </div>
  </header>

  <main class="auth-container">
    <form id="loginForm" class="auth-form" method="post" action="#" novalidate>
      <h2>Sign in</h2>

      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <div id="loginError" class="form-error" aria-live="polite" style="display:none;"></div>

      <button type="submit" class="btn-cta btn-cta-primary">Login</button>

      <p class="muted">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || 'welcome.html';
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginError.style.display = 'none';
      const payload = {
        name: document.getElementById('name').value.trim(),
        password: document.getElementById('password').value
      };
      fetch('../php/api_login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        credentials: 'same-origin'
      }).then(r => r.json()).then(j => {
        if (j && j.success) {
          window.location.href = redirectTarget;
        } else {
          loginError.textContent = j.error || 'Login failed';
          loginError.style.display = 'block';
        }
      }).catch(() => {
        loginError.textContent = 'Network or server error'; loginError.style.display = 'block';
      });
    });
  </script>
</body>
</html>
